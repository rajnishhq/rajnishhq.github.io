<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rshq.cloud | Portal</title>
    <style>
        :root {
            --primary: #00f3ff;
            --secondary: #ff007f;
            --dark: #0a0a16;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--dark);
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Interactive Particle Background */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Main Container */
        .glass-card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3rem;
            border-radius: 24px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5),
                        0 0 40px rgba(0, 243, 255, 0.1);
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        /* Typography */
        .logo-container {
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: lowercase;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #8a8aa3;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 2rem;
        }

        p {
            color: #b5b5c9;
            line-height: 1.6;
            margin-bottom: 2.5rem;
            font-size: 1.05rem;
        }

        /* Interactive Button */
        .btn {
            display: inline-block;
            text-decoration: none;
            color: var(--dark);
            background: linear-gradient(45deg, var(--primary), #00a8ff);
            padding: 1rem 2.5rem;
            border-radius: 50px;
            font-weight: 700;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(0, 243, 255, 0.7),
                        0 0 15px rgba(255, 0, 127, 0.5);
            background: linear-gradient(45deg, #00a8ff, var(--secondary));
            color: #fff;
        }

        /* Footer Status */
        .status-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #6c6c85;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #00ff66;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff66;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 102, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(0, 255, 102, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 102, 0); }
        }
    </style>
</head>
<body>

    <canvas id="stars"></canvas>

    <div class="glass-card">
        <div class="logo-container">
            <h1>rshq.cloud</h1>
            <div class="subtitle">Experiment 01</div>
        </div>
        
        <p>A personal deployment playground floating somewhere in the digital stratosphere. Something impactful is actively compiling behind the scenes.</p>
        
        <a href="#" class="btn" onclick="triggerWarp()">Initiate Hyperlink</a>
        
        <div>
            <div class="status-tag">
                <span class="pulse-dot"></span>
                Cloud Node Active
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('stars');
        const ctx = canvas.getContext('2d');

        let particles = [];
        const particleCount = 120;
        let mouse = { x: null, y: null, radius: 150 };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
        });

        window.addEventListener('mouseout', () => {
            mouse.x = null;
            mouse.y = null;
        });

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.baseX = this.x;
                this.baseY = this.y;
                this.density = (Math.random() * 30) + 10;
                this.color = Math.random() > 0.5 ? '#00f3ff' : '#ff007f';
                this.alpha = Math.random() * 0.5 + 0.2;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.alpha;
                ctx.fill();
            }

            update() {
                // Mouse interaction physics
                if (mouse.x != null && mouse.y != null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    let forceDirectionX = dx / distance;
                    let forceDirectionY = dy / distance;
                    let maxDistance = mouse.radius;
                    let force = (maxDistance - distance) / maxDistance;
                    
                    if (distance < mouse.radius) {
                        this.x -= forceDirectionX * force * this.density * 0.6;
                        this.y -= forceDirectionY * force * this.density * 0.6;
                    } else {
                        if (this.x !== this.baseX) {
                            let dx = this.x - this.baseX;
                            this.x -= dx / 20;
                        }
                        if (this.y !== this.baseY) {
                            let dy = this.y - this.baseY;
                            this.y -= dy / 20;
                        }
                    }
                } else {
                    // Floating idle drift
                    this.baseX += Math.sin(Date.now() * 0.001 + this.density) * 0.05;
                    this.baseY += Math.cos(Date.now() * 0.001 + this.density) * 0.05;
                    this.x = this.baseX;
                    this.y = this.baseY;
                }
            }
        }

        function init() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            requestAnimationFrame(animate);
        }

        function triggerWarp() {
            // Creative visual click interaction
            particles.forEach(p => {
                p.density = p.density * 5;
                setTimeout(() => p.density = p.density / 5, 1000);
            });
            alert("🚀 System Check: rshq.cloud core operational! Feel free to link your GitHub projects here.");
        }

        init();
        animate();
    </script>
</body>
</html>
